/* Full-screen ARVI thinking state: dark neon lotus from the user's reference */
#arviThinking{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;background:#000;color:#e8fffd;opacity:0;transition:opacity .28s ease;}
#arviThinking.active{display:flex;opacity:1}
#arviThinking .neon-lotus{width:min(72vw,390px);height:auto;overflow:visible;filter:drop-shadow(0 0 3px #2dd4cf88) drop-shadow(0 0 15px #2dd4cf22)}
#arviThinking .neon-lotus path{fill:none;stroke:#2dd4cf;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:520;stroke-dashoffset:520;animation:neonDraw 2.8s ease-in-out infinite alternate;}
#arviThinking .neon-lotus .inner-line{stroke-dasharray:2 7;stroke-dashoffset:0;animation:neonPulse 1.8s ease-in-out infinite}
#arviThinking .neon-lotus circle{fill:#2dd4cf;filter:drop-shadow(0 0 5px #2dd4cf);animation:dotPulse 1.5s ease-in-out infinite alternate}
#arviThinking .thinking-label{margin-top:26px;font:500 12px Inter,system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#7be9e4;opacity:.8}
@keyframes neonDraw{0%{stroke-dashoffset:520;opacity:.35}55%,100%{stroke-dashoffset:0;opacity:1}}
@keyframes neonPulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes dotPulse{from{opacity:.45}to{opacity:1}}
@media(prefers-reduced-motion:reduce){#arviThinking .neon-lotus path,#arviThinking .neon-lotus .inner-line,#arviThinking .neon-lotus circle{animation:none;stroke-dashoffset:0}}

function lotusMark(){return '<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#5e9e7e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M50 82C31 63 34 38 50 15C66 38 69 63 50 82Z"/><path d="M50 82C25 78 13 59 13 39C30 48 43 62 50 82Z"/><path d="M50 82C75 78 87 59 87 39C70 48 57 62 50 82Z"/><path d="M50 82C31 88 17 79 9 68C26 69 40 76 50 82Z"/><path d="M50 82C69 88 83 79 91 68C74 69 60 76 50 82Z"/><path d="M50 43V80" stroke-dasharray="2 5"/></g></svg>'}
function drawHistory(){const box=$("chatbox");if(!box)return;box.replaceChildren();if(!aiHistory.length){const welcome=document.createElement("div");welcome.className="assistant-empty";welcome.innerHTML='<svg class="welcome-lotus" viewBox="0 0 220 170" role="img" aria-label="ARVI lotus"><defs><radialGradient id="welcomeGlow"><stop stop-color="#f5e6ad" stop-opacity=".85"/><stop offset="1" stop-color="#f5e6ad" stop-opacity="0"/></radialGradient></defs><circle cx="110" cy="92" r="78" fill="url(#welcomeGlow)"/><g fill="none" stroke="#5e9e7e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M110 145C70 118 73 75 110 20C147 75 150 118 110 145Z"/><path d="M110 145C42 141 22 100 25 58C61 78 88 99 110 145Z"/><path d="M110 145C178 141 198 100 195 58C159 78 132 99 110 145Z"/><path d="M110 145C59 159 26 140 10 112C51 118 78 127 110 145Z"/><path d="M110 145C161 159 194 140 210 112C169 118 142 127 110 145Z"/><path d="M110 82V137" stroke-dasharray="2 6"/></g><circle cx="110" cy="100" r="3" fill="#c9a24b"/></svg><h2>Namaste! I’m ARVI.</h2><p>How can I help your studio today?</p>';box.appendChild(welcome);return}aiHistory.forEach(item=>{if(item.role==="assistant"&&!item.pending){const row=document.createElement("div");row.className="assistant-reply-row";const mark=document.createElement("div");mark.className="reply-lotus";mark.innerHTML=lotusMark();row.appendChild(mark);const b=document.createElement("div");b.className="bubble";b.textContent=item.text;row.appendChild(b);if(item.error){const retry=document.createElement("button");retry.type="button";retry.className="alt";retry.textContent="Retry";retry.onclick=()=>retryMessage(item.id);b.appendChild(document.createElement("br"));b.appendChild(retry)}box.appendChild(row);return}const b=document.createElement("div");b.className="bubble"+(item.role==="user"?" me":"");if(item.pending){b.innerHTML='<svg class="thinking-lotus" viewBox="0 0 220 170" aria-label="ARVI is thinking" role="img"><g fill="none" stroke="#2dd4cf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M110 145C70 118 73 75 110 20C147 75 150 118 110 145Z"/><path d="M110 145C42 141 22 100 25 58C61 78 88 99 110 145Z"/><path d="M110 145C178 141 198 100 195 58C159 78 132 99 110 145Z"/><path d="M110 145C59 159 26 140 10 112C51 118 78 127 110 145Z"/><path d="M110 145C161 159 194 140 210 112C169 118 142 127 110 145Z"/><path d="M110 145C86 119 91 89 110 68C129 89 134 119 110 145Z"/><path d="M110 82V137" stroke-dasharray="2 8"/></g><g fill="#2dd4cf"><circle cx="110" cy="91" r="4"/><circle cx="110" cy="104" r="4"/><circle cx="110" cy="117" r="4"/><circle cx="110" cy="130" r="4"/></g></svg><span>Preparing your answer…</span>'}else{b.textContent=item.text}box.appendChild(b)});box.scrollTop=box.scrollHeight}
function updateGreeting(){const now=new Date(),h=now.getHours();let greeting,icon;if(h<12){greeting="Good Morning";icon="☀"}else if(h<17){greeting="Good Afternoon";icon="☼"}else if(h<21){greeting="Good Evening";icon="☾"}else{greeting="Good Night";icon="☾"}const g=$("greetingText"),i=$("greetingIcon");if(g)g.textContent=greeting;if(i)i.textContent=icon;const e=$("topEyebrow");if(e&&page==="dashboard")e.textContent="ARVYX · INTELLIGENCE IN HARMONY"}

async function callFunction(url,payload,field){const headers={"Content-Type":"application/json"};if(SUPABASE_ANON_KEY){headers.apikey=SUPABASE_ANON_KEY;headers.Authorization="Bearer "+SUPABASE_ANON_KEY}const res=await fetch(url,{method:"POST",headers,body:JSON.stringify(payload)});const raw=await res.text();let data;try{data=JSON.parse(raw)}catch{data={}}if(!res.ok)throw new Error((data.error||data.message||raw||("HTTP "+res.status)).toString().slice(0,240));const answer=data[field]||data.text||data.answer||data.response;if(typeof answer!=="string"||!answer.trim())throw new Error("The AI function returned no answer text.");return answer.trim()}
async function sendToAI(q){const box=$("chatbox"),input=$("askinput"),btn=$("sendBtn"),status=$("aiStatus");if(!box||!q.trim()||busy)return;busy=true;const id=Date.now()+"-"+Math.random().toString(36).slice(2);aiHistory.push({id,role:"user",text:q});const reply={id,role:"assistant",text:"ARVI is thinking…",pending:true};aiHistory.push(reply);drawHistory();if(input)input.value="";if(btn)btn.disabled=true;if(status)status.textContent="ARVI is thinking…";try{let answer,provider;const studioContext={students:students.map(s=>({name:s.name,membership:s.membership,attendance:s.attendance,payment:s.payment,notes:s.notes})),conversations:chats.map(c=>({name:c.name,type:c.type,message:c.message,status:c.status,time:c.time})),classes:classes.map(c=>({name:c.name,time:c.time,teacher:c.teacher,capacity:c.capacity})),followups:tasks.map(t=>({title:t.title,due:t.due,priority:t.priority,done:t.done}))};const instructions=`You are ARVI, an AI assistant created by ARVYX. a practical and warm AI assistant for yoga teachers and yoga studios. Help with student enquiries, lead qualification, trial-class conversion, class scheduling, membership renewals, attendance follow-ups, customer service, and message drafts.

RESPONSE STYLE: Answer directly and naturally, like a capable conversational assistant. Use concise headings or bullets only when useful. Avoid generic filler and avoid repeating the question. For a draft, provide a ready-to-send message first, then a brief note if needed. For planning, give clear actionable steps. Ask at most one clarifying question only when it materially changes the answer.

ACCURACY AND SAFETY: Use only the sample workspace context supplied below when asked about studio records. Never claim that a message was sent, a booking was made, a payment was checked, or a real WhatsApp account was connected. Do not invent student details, prices, schedules, policies, or health advice. If information is missing, say so and label suggestions as examples. For yoga/health questions, avoid diagnosing or promising treatment; advise adapting practice to individual needs and consulting a qualified clinician for medical concerns. Keep personal student data private and share only what is needed.

SAMPLE WORKSPACE CONTEXT (demo data, not live records): ${JSON.stringify(studioContext)}

USER REQUEST: ${q}`;try{answer=await callFunction(GEMINI_URL,{prompt:instructions},"text");provider="Gemini"}catch(geminiError){if(status)status.textContent="Gemini unavailable. Trying backup AI…";answer=await callFunction(OPENROUTER_URL,{message:instructions},"answer");provider="OpenRouter backup"}reply.text=answer;reply.provider=provider;delete reply.pending;if(status)status.textContent="Answer ready."}catch(err){reply.text="ARVI couldn’t get an answer. Please check your connection and try again.";reply.error=true;reply.retryFor=q;delete reply.pending;if(status)status.textContent="Request failed: "+String(err.message||"Unknown error").slice(0,140)}finally{busy=false;if(btn)btn.disabled=false;drawHistory();if(input)input.focus();const thinkingScreen=$("arviThinking");if(thinkingScreen){thinkingScreen.classList.remove("active");thinkingScreen.style.display="none"}}
}
function clearChat(){if(busy)return;aiHistory.length=0;drawHistory();const status=$("aiStatus");if(status)status.textContent="Your new conversation is ready.";const input=$("askinput");if(input)input.focus()}
function retryMessage(id){const index=aiHistory.findIndex(x=>x.id===id&&x.error);if(index<0)return;const q=aiHistory[index].retryFor;aiHistory.splice(index,1);sendToAI(q)}
function download(n,t,type){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([t],{type}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
